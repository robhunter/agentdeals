name: Read-only archive settlement evaluation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke, backlog, mapbox-window, review-rule, history-rule, or year-rule"
        required: true
        default: smoke
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.mode == 'mapbox-window' && 'archive-window-replay' || 'archive-settlement' }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download the saved captures for the prompt-window replay
        if: inputs.mode == 'mapbox-window' || inputs.mode == 'review-rule' || (inputs.mode == 'history-rule' || inputs.mode == 'year-rule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ (inputs.mode == 'review-rule' || (inputs.mode == 'history-rule' || inputs.mode == 'year-rule')) && '42446730220' || '42446506294' }}
        run: gh run download "$SOURCE_RUN" --name archive-settlement-evaluation --dir prior-evaluation
      - name: Download the saved stated-before replay
        if: (inputs.mode == 'history-rule' || inputs.mode == 'year-rule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 42451026818 --name archive-settlement-evaluation --dir prior-review
      - name: Download the saved historical follow-up
        if: inputs.mode == 'year-rule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 42461774473 --name archive-settlement-evaluation --dir prior-history
      - name: Combine saved inputs without dropping any attempts
        if: inputs.mode == 'year-rule'
        run: |
          python3 - <<'PYINPUTS'
          import pathlib, shutil
          out = pathlib.Path('combined-inputs')
          out.mkdir()
          for name in ['metadata.json', 'report.json']:
              shutil.copyfile(pathlib.Path('prior-evaluation') / name, out / name)
          for filename in ['archive-fetches.jsonl', 'model-calls.jsonl']:
              with (out / filename).open('w') as dest:
                  for directory in ['prior-evaluation', 'prior-review', 'prior-history']:
                      source = pathlib.Path(directory) / filename
                      if source.exists():
                          dest.write(source.read_text())
          for directory in ['prior-evaluation', 'prior-review', 'prior-history']:
              for source in pathlib.Path(directory).glob('*.txt'):
                  shutil.copyfile(source, out / source.name)
          PYINPUTS
      - name: Read the records without writing catalogue data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARCHIVE_EVAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$ARCHIVE_EVAL_MODE" = "mapbox-window" ]; then
            node scripts/replay-mapbox-window.mjs
          elif [ "$ARCHIVE_EVAL_MODE" = "review-rule" ]; then
            node scripts/replay-reviewed-claims.mjs
          elif [ "$ARCHIVE_EVAL_MODE" = "history-rule" ]; then
            node scripts/replay-archive-history.mjs . prior-evaluation prior-review archive-evaluation --allow-missing-history
          elif [ "$ARCHIVE_EVAL_MODE" = "year-rule" ]; then
            node scripts/replay-archive-year-rule.mjs . combined-inputs archive-evaluation --live-history
          else
            node scripts/evaluate-archive.mjs
          fi
      - name: Ensure catalogue bytes were preserved
        if: always()
        run: git diff --exit-code -- data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-settlement-evaluation
          path: archive-evaluation/
