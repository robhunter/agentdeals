name: Daily rolling re-verification

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of oldest entries to re-verify"
        required: false
        default: "75"
      restate_limit:
        description: "Most withheld entries this run may restate — blank restates every one a reading can answer for"
        required: false
        default: ""

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: reverify-rolling
  cancel-in-progress: false

jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Name the rendering client a page that comes back too short is read with
        run: node -e "import('./scripts/rendered-page.js').then((m) => console.log(m.findRenderer() ?? 'none found on this runner'))"

      - name: Run rolling re-verification
        id: reverify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          LIMIT="${{ github.event.inputs.limit || '75' }}"
          node scripts/reverify-rolling.js --ai --limit "$LIMIT" | tee /tmp/reverify.log
          VERIFIED=$(grep -oE '^Verified \(date bumped\): [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          FLAGGED=$(grep -oE '^Flagged \(URL/AI failure\): [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          RECORDED=$(grep -oE '^Recorded to data/deal_changes.json: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          QUARANTINED=$(grep -oE '^In quarantine, retried every [0-9]+ days: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          RETRIED=$(grep -oE '^Retried from quarantine: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          REPICKED=$(grep -oE '^Checked again on the next run: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          HELD=$(grep -oE '^Awaiting a second reading, given up on after [0-9]+ days: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          DRAWN=$(grep -oE '^Drawn from the queue, so pages this run advances: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          SECOND=$(grep -oE '^Drawn to give a held demoting verdict its second reading: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          echo "held=$HELD" >> "$GITHUB_OUTPUT"
          echo "drawn=$DRAWN" >> "$GITHUB_OUTPUT"
          echo "second=$SECOND" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "flagged=$FLAGGED" >> "$GITHUB_OUTPUT"
          echo "recorded=$RECORDED" >> "$GITHUB_OUTPUT"
          echo "quarantined=$QUARANTINED" >> "$GITHUB_OUTPUT"
          echo "retried=$RETRIED" >> "$GITHUB_OUTPUT"
          echo "repicked=$REPICKED" >> "$GITHUB_OUTPUT"

      - name: Compile, so the restatement pass reads the predicates the site reads
        run: npm run build

      - name: Store the readings the withheld entries already show, and count the ones no reading answers
        id: restate
        env:
          RESTATE_LIMIT: ${{ github.event.inputs.restate_limit }}
        run: |
          set -o pipefail
          node scripts/restate-superseded-terms.js --write ${RESTATE_LIMIT:+--limit "$RESTATE_LIMIT"} | tee /tmp/restate.log
          RESTATED=$(grep -oE '^Restated this run: [0-9]+' /tmp/restate.log | grep -oE '[0-9]+$' || echo 0)
          ANSWERABLE=$(grep -oE '^We may restate from that reading: [0-9]+' /tmp/restate.log | grep -oE '[0-9]+$' || echo 0)
          STILL=$(grep -oE '^Re-read since the record and still withheld: [0-9]+' /tmp/restate.log | grep -oE '[0-9]+$' || echo 0)
          echo "restated=$RESTATED" >> "$GITHUB_OUTPUT"
          echo "answerable=$ANSWERABLE" >> "$GITHUB_OUTPUT"
          echo "still_withheld=$STILL" >> "$GITHUB_OUTPUT"

      - name: Run the suite, then push to main only if it is green
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_RATCHET_BUDGETS: "1"
          GATE_UPDATE_PAGE_LASTMOD: "1"
          GATE_REGENERATE_LLM_INDEX: "1"
          GATE_SYNC_PAGE_REVIEWS: "1"
          RESTATED: ${{ steps.restate.outputs.restated }}
          ANSWERABLE: ${{ steps.restate.outputs.answerable }}
          STILL_WITHHELD: ${{ steps.restate.outputs.still_withheld }}
          VERIFIED: ${{ steps.reverify.outputs.verified }}
          FLAGGED: ${{ steps.reverify.outputs.flagged }}
          RECORDED: ${{ steps.reverify.outputs.recorded }}
          QUARANTINED: ${{ steps.reverify.outputs.quarantined }}
          RETRIED: ${{ steps.reverify.outputs.retried }}
          REPICKED: ${{ steps.reverify.outputs.repicked }}
          HELD: ${{ steps.reverify.outputs.held }}
          DRAWN: ${{ steps.reverify.outputs.drawn }}
          SECOND: ${{ steps.reverify.outputs.second }}
        run: |
          bash scripts/gate-data-push.sh \
            data-quarantine/rolling-reverification \
            "data(auto): rolling re-verification — ${VERIFIED} verified of ${DRAWN} drawn from the queue, ${SECOND} re-read to corroborate a held verdict, ${FLAGGED} flagged, ${RECORDED} changes recorded, ${RESTATED} of ${ANSWERABLE} withheld entries restated from the reading their page already showed with ${STILL_WITHHELD} re-read and still withheld, ${HELD} awaiting a second reading, ${RETRIED} retried from quarantine, ${QUARANTINED} in quarantine, ${REPICKED} to be checked again" \
            data/index.json data/deal_changes.json data/change_refusals.json data/change_corroboration.json data/verification_state.json data/restated_terms.json data/quality_budgets.json data/page-lastmod.json data/page-reviews.json artifacts/free-llm-api-index/README.md

      - name: Say where it can be seen what the gate did with this run's data
        if: always() && (steps.gate.outputs.quarantined == 'true' || steps.gate.outputs.pushed_over_failures == 'true' || steps.gate.outputs.drifted_guards != '' || steps.gate.outputs.pushed_commit != '' || steps.gate.outputs.pushed_nothing == 'true' || steps.gate.outputs.held_back_vendors != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARANTINED: ${{ steps.gate.outputs.quarantined }}
          QUARANTINE_REF: ${{ steps.gate.outputs.quarantine_ref }}
          QUARANTINE_REASON: ${{ steps.gate.outputs.quarantine_reason }}
          PUSHED_OVER_FAILURES: ${{ steps.gate.outputs.pushed_over_failures }}
          NON_BLOCKING_FILES: ${{ steps.gate.outputs.non_blocking_files }}
          HELD_BACK_VENDORS: ${{ steps.gate.outputs.held_back_vendors }}
          DRIFTED_GUARDS_BODY: ${{ steps.gate.outputs.drifted_guards_body }}
          PUSHED_COMMIT: ${{ steps.gate.outputs.pushed_commit }}
          PUSHED_NOTHING: ${{ steps.gate.outputs.pushed_nothing }}
        run: |
          if [ "$QUARANTINED" = "true" ]; then
            bash scripts/report-data-push-outcome.sh "Daily rolling re-verification" refused "$QUARANTINE_REF" "$QUARANTINE_REASON"
            exit 0
          fi
          if [ -n "$HELD_BACK_VENDORS" ]; then
            bash scripts/report-data-push-outcome.sh "Daily rolling re-verification" held-back-a-vendor "$HELD_BACK_VENDORS"
          fi
          if [ -n "$DRIFTED_GUARDS_BODY" ] && [ -s "$DRIFTED_GUARDS_BODY" ]; then
            bash scripts/report-data-push-outcome.sh "Daily rolling re-verification" drifted-a-guard "$(cat "$DRIFTED_GUARDS_BODY")"
          fi
          if [ "$PUSHED_OVER_FAILURES" = "true" ]; then
            bash scripts/report-data-push-outcome.sh "Daily rolling re-verification" shipped-over-failures "$NON_BLOCKING_FILES"
          fi
          if [ -n "$PUSHED_COMMIT" ] || [ "$PUSHED_NOTHING" = "true" ]; then
            bash scripts/report-data-push-outcome.sh "Daily rolling re-verification" reached-main "$PUSHED_COMMIT"
          fi

      - name: Measure the quality budgets against the data that reached main
        id: budgets
        run: node scripts/report-quality-budgets.js --body /tmp/quality-budgets.md --github-output

      - name: Say on an issue which budget is over its ceiling
        if: always() && steps.budgets.outputs.over != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVER: ${{ steps.budgets.outputs.over }}
        run: bash scripts/report-quality-budgets.sh /tmp/quality-budgets.md "$OVER"

      - name: Check the change log is still being written to
        id: staleness
        if: always()
        run: |
          git fetch origin main
          node scripts/check-change-log-staleness.js --from-ref origin/main

      - name: Signal that no change detector is scheduled
        if: always() && steps.staleness.outputs.open_absence_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/signal-detector-absence.sh reverify-detector-not-scheduled
