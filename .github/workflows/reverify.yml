name: Read-only archive settlement evaluation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (OneSignal and Mapbox) or backlog (all unsettled and the 42 corrections)"
        required: true
        default: smoke
permissions:
  contents: read
concurrency:
  group: archive-settlement
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Read the records without writing catalogue data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARCHIVE_EVAL_MODE: ${{ inputs.mode }}
        run: node scripts/evaluate-archive.mjs
      - name: Ensure catalogue bytes were preserved
        if: always()
        run: git diff --exit-code -- data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-settlement-evaluation
          path: archive-evaluation/
