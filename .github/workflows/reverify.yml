name: Daily rolling re-verification

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of oldest entries to re-verify"
        required: false
        default: "75"

permissions:
  contents: write
  issues: write

concurrency:
  group: reverify-rolling
  cancel-in-progress: false

jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run rolling re-verification
        id: reverify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          LIMIT="${{ github.event.inputs.limit || '75' }}"
          node scripts/reverify-rolling.js --ai --limit "$LIMIT" | tee /tmp/reverify.log
          VERIFIED=$(grep -oE '^Verified \(date bumped\): [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          FLAGGED=$(grep -oE '^Flagged \(URL/AI failure\): [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          RECORDED=$(grep -oE '^Recorded to data/deal_changes.json: [0-9]+' /tmp/reverify.log | grep -oE '[0-9]+$' || echo 0)
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "flagged=$FLAGGED" >> "$GITHUB_OUTPUT"
          echo "recorded=$RECORDED" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        env:
          VERIFIED: ${{ steps.reverify.outputs.verified }}
          FLAGGED: ${{ steps.reverify.outputs.flagged }}
          RECORDED: ${{ steps.reverify.outputs.recorded }}
        run: |
          if git diff --quiet -- data/index.json data/deal_changes.json data/change_refusals.json; then
            echo "No changes to data/index.json, data/deal_changes.json or data/change_refusals.json — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/deal_changes.json data/change_refusals.json
          git commit -m "data(auto): rolling re-verification — ${VERIFIED} verified, ${FLAGGED} flagged, ${RECORDED} changes recorded"
          git push origin HEAD:main

      - name: Check the change log is still being written to
        id: staleness
        if: always()
        run: node scripts/check-change-log-staleness.js

      - name: Signal that no change detector is scheduled
        if: always() && steps.staleness.outputs.open_absence_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKER: reverify-detector-not-scheduled
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search "$MARKER in:body" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Absence already signalled by issue #$EXISTING — not opening another."
            exit 0
          fi
          node scripts/detector-absence-issue-body.js "$MARKER" > /tmp/absence-issue.md
          gh issue create \
            --title "No change detector is scheduled — the daily job cannot notice a pricing change" \
            --label "priority/high" \
            --label "type: bug" \
            --body-file /tmp/absence-issue.md
