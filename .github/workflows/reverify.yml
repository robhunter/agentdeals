name: Read-only archive settlement evaluation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke, backlog, or mapbox-window (saved captures; no Archive calls)"
        required: true
        default: smoke
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.mode == 'mapbox-window' && 'archive-window-replay' || 'archive-settlement' }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download the saved captures for the prompt-window replay
        if: inputs.mode == 'mapbox-window'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 42446506294 --name archive-settlement-evaluation --dir prior-evaluation
      - name: Read the records without writing catalogue data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARCHIVE_EVAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$ARCHIVE_EVAL_MODE" = "mapbox-window" ]; then
            node scripts/replay-mapbox-window.mjs
          else
            node scripts/evaluate-archive.mjs
          fi
      - name: Ensure catalogue bytes were preserved
        if: always()
        run: git diff --exit-code -- data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-settlement-evaluation
          path: archive-evaluation/
