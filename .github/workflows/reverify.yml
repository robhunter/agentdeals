name: Read-only archive bracket claim audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: archive-settlement
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Read both endpoints serially without changing catalogue data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/evaluate-bracket-claims.mjs . artifacts/bracket-evaluation/inputs.json artifacts/bracket-evaluation/cached-calls.jsonl bracket-evaluation --allow-network
      - name: Ensure catalogue bytes were preserved
        if: always()
        run: git diff --exit-code -- data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-bracket-evaluation
          path: bracket-evaluation/
