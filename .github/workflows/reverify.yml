name: Verifier window comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verifier-window-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare prompt windows on identical page snapshots
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/compare-verifier-windows.mjs
      - name: Ensure catalogue bytes were preserved
        if: always()
        run: git diff --exit-code -- data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-window-comparison
          path: verifier-window-comparison/
