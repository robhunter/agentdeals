name: Data — records a pull request adds

on:
  pull_request:
    paths:
      - "data/index.json"
      - "src/added-records.ts"
      - "src/ranking.ts"
      - "scripts/refuse-added-unnamed-free-records.js"
      - ".github/workflows/added-records.yml"

permissions:
  contents: read

jobs:
  added-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Refuse an added record classed free whose cited page does not name its vendor
        run: node scripts/refuse-added-unnamed-free-records.js --base "origin/${{ github.base_ref }}"
