name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        env:
          POPULATION_FLOOR_LOG: /tmp/population-floors.jsonl
          SUITE_TIME_LIMIT_MINUTES: 45
        run: |
          set +e
          timeout --kill-after=1m "${SUITE_TIME_LIMIT_MINUTES}m" npm test
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            message="npm test ran past its ${SUITE_TIME_LIMIT_MINUTES}-minute limit and was stopped, so this run reports as failed."
            echo "::error title=Tests timed out::$message"
            echo "Tests timed out: $message" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Say how close every population floor is to going red
        if: always()
        run: |
          if [ -s /tmp/population-floors.jsonl ]; then
            node scripts/report-population-floors.js /tmp/population-floors.jsonl --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite wrote no floor log, so no margin can be read off this run."
          fi
